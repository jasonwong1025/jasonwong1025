<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Wong Jia Sen, Full Stack Developer and Software Engineering student">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');
      .title { font-family: 'Press Start 2P', 'Courier New', monospace; }
      .mono { font-family: 'VT323', 'Courier New', monospace; }
    </style>
    <linearGradient id="bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E1C"/>
      <stop offset="1" stop-color="#131A33"/>
    </linearGradient>
    <pattern id="scan-d" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg-d)"/>
  <rect width="1200" height="260" fill="url(#scan-d)"/>

  <g stroke="#4CE0FF" stroke-width="4" fill="none">
    <path d="M24,52 L24,24 L52,24"/>
    <path d="M1148,24 L1176,24 L1176,52"/>
    <path d="M1176,208 L1176,236 L1148,236"/>
    <path d="M52,236 L24,236 L24,208"/>
  </g>

  <text x="40" y="42" class="mono" font-size="20" fill="#4CE0FF">&gt; SYSTEM BOOT</text>

  <text x="604" y="144" text-anchor="middle" class="title" font-size="44" fill="#FF2E9A" opacity="0.75">WONG JIA SEN</text>
  <text x="596" y="137" text-anchor="middle" class="title" font-size="44" fill="#4CE0FF" opacity="0.75">WONG JIA SEN</text>
  <text x="600" y="140" text-anchor="middle" class="title" font-size="44" fill="#EAF2FF">WONG JIA SEN</text>

  <text x="600" y="182" text-anchor="middle" class="mono" font-size="27" fill="#F5C518">Full Stack Developer &amp; SWE student at APU</text>

  <text x="1150" y="228" text-anchor="end" class="mono" font-size="20" fill="#34D399">PRESS START</text>
  <rect x="1156" y="212" width="14" height="20" fill="#34D399">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="24" y="248" width="1152" height="4" fill="#34D399"/>
</svg>
