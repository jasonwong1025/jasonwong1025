<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="Chibi_programmer_using_laptop_code_202605291548.jpeg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="Chibi_programmer_using_laptop_code_202605291548.jpeg" />
    <meta name="description" content="Projects by Jia Sen — Beacon, NextGen Fitness capstone, OODJ, and open-source work." />
    <title>Work · Jia Sen</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/effects.css" />
    <link rel="stylesheet" href="css/components/nav.css" />
    <link rel="stylesheet" href="css/components/btn.css" />
    <link rel="stylesheet" href="css/components/shell.css" />
    <link rel="stylesheet" href="css/components/mascot.css" />
    <link rel="stylesheet" href="css/pages/work.css" />
  </head>
  <body class="shell" data-page="work">
    <div class="noise" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--cool" aria-hidden="true"></div>

    <div class="intro" data-intro aria-hidden="true">
      <div class="intro__inner">
        <span class="intro__name" data-intro-name>Wong <em>Jia Sen</em></span>
        <span class="intro__bar" data-intro-bar></span>
        <span class="intro__tag" data-intro-tag>Work</span>
      </div>
    </div>

    <div data-nav-slot></div>

    <div class="shell__main">
      <header class="page-head container" data-page-head>
        <p class="page-head__label" data-page-label>02 / Work</p>
        <h1 class="page-head__title" data-page-title>Projects</h1>
        <p class="page-head__desc" data-page-desc>
          A index of shipped work — extensions, coursework, and experiments in public repositories.
        </p>
      </header>

      <section class="section container--wide">
        <div class="container work-filter" data-work-filter data-reveal>
          <button class="work-filter__btn is-active" type="button" data-filter="all">All</button>
          <button class="work-filter__btn" type="button" data-filter="typescript">TypeScript</button>
          <button class="work-filter__btn" type="button" data-filter="dart">Dart</button>
          <button class="work-filter__btn" type="button" data-filter="java">Java</button>
        </div>

        <div class="work-list" data-work-list></div>
      </section>

      <section class="section container split-layout">
        <div data-reveal>
          <span class="tag">Mascot</span>
          <h2 class="section__title" style="margin-top: var(--space-md)">Built in<br />public</h2>
          <p class="section__subtitle" style="margin-top: var(--space-md)">
            Every project is documented, versioned, and shared on GitHub. No black boxes.
          </p>
          <div class="btn-group" style="margin-top: var(--space-lg)">
            <a class="btn btn--fill" href="https://github.com/jasonwong1025" target="_blank" rel="noopener noreferrer">
              GitHub Profile <span class="btn__arrow">→</span>
            </a>
          </div>
        </div>
        <div data-mascot="hero"></div>
      </section>

      <div data-cta-slot></div>
    </div>

    <div data-status-slot></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
