<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0A1A" />
    <meta name="robots" content="noindex, nofollow" />

    <title>404 — Connection Lost · Wong Jia Sen</title>
    <meta name="description" content="Page not found — the route cable got severed. Return to the arcade portfolio." />

    <link rel="icon" href="pic_pixel.jpeg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/arcade.css?v=13" />
  </head>

  <body class="e404-page">
    <canvas class="stars" data-stars aria-hidden="true"></canvas>
    <div class="crt" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <header class="nav e404__nav">
      <a class="brand" href="/" aria-label="Back to portfolio home">
        <span class="brand__txt">WJS</span><span class="brand__caret">▮</span>
      </a>
      <span class="e404__nav-tag" aria-hidden="true">OFFLINE</span>
    </header>

    <main class="e404">
      <div class="e404__cab panel" data-e404-cab>
        <div class="panel__bar" data-bar="error.sys — connection lost"></div>

        <div class="e404__screen">
          <div class="e404__head">
            <p class="e404__code" aria-hidden="true"><span data-e404-glitch>404</span></p>
            <div class="e404__titles">
              <h1 class="e404__title">Connection lost</h1>
              <p class="e404__sub">The route cable got severed mid-transfer. No cartridge loaded at this address.</p>
            </div>
          </div>

          <div class="e404__stage">
            <div class="e404__glow"></div>
            <div class="e404__char">
              <img class="e404__img" src="404.png" alt="Pixel character holding severed cables with sparks flying" width="512" height="640" decoding="async" />
              <span class="e404__spark e404__spark--1"></span>
              <span class="e404__spark e404__spark--2"></span>
              <span class="e404__spark e404__spark--3"></span>
              <span class="e404__spark e404__spark--4"></span>
            </div>
          </div>

          <div class="e404__term panel" role="status" aria-live="polite">
            <p class="e404__log" data-e404-log>booting recovery shell…</p>
            <dl class="e404__meta">
              <div><dt>error</dt><dd>ERR_PAGE_NOT_FOUND</dd></div>
              <div><dt>route</dt><dd data-e404-path>/unknown</dd></div>
              <div><dt>status</dt><dd>cable severed — sparks detected</dd></div>
            </dl>
          </div>

          <div class="e404__actions">
            <a class="btn btn--gold" href="/" data-blip>▶ Return to start</a>
            <a class="btn btn--cyan" href="/#contact">Contact HQ</a>
          </div>
        </div>
      </div>

      <p class="e404__hint">Press <kbd>Esc</kbd> or tap home to respawn.</p>
    </main>

    <script type="module" src="js/404.js?v=1"></script>
  </body>
</html>
